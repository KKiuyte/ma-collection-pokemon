// Sous-onglet « Partages » : ce qu'on te partage (lecture seule).
// Cliquer sur une carte ouvre la fiche habituelle : ça gère TA collection à toi (ex. l'ajouter
// à tes souhaits), jamais celle de la personne qui partage — sa collection reste intouchée.
async function renderSharedFeedPanel(panel){
  if (!sharedLoaded){
    panel.innerHTML = `<div class="msg"><div class="spin"></div>Chargement de ce qu'on te partage…</div>`;
    await loadShared();
    sharedLoaded = true;
    if (view === "shared" && sharedSubTab === "feed") renderShared();
    return;
  }
  if (!sharedList.length){
    panel.innerHTML = emptyMsg(ICONS.eye, "Personne ne t'a encore partagé ses souhaits ou ses échanges.<br>Demande à un membre de t'autoriser dans « Demandes d'accès ».");
    return;
  }
  if (!allCards){
    panel.innerHTML = `<div class="msg"><div class="spin"></div>Préparation… (une seule fois)</div>`;
    await loadAllCards();
    if (allCards && view === "shared" && sharedSubTab === "feed") renderShared();
    return;
  }
  const byId = {};
  for (const c of allCards) byId[c.id] = c;

  const suggestions = tradeSuggestions();
  const sugIds = [...new Set(suggestions.flatMap(g => [...g.iCouldGet, ...g.iCouldGive]).map(e => e.id))];
  if (sugIds.length && sugIds.some(metaStale)){
    panel.innerHTML = `<div class="msg"><div class="spin"></div>Chargement des prix…</div>`;
    await fetchMissingMeta(sugIds);
    if (view === "shared" && sharedSubTab === "feed") renderShared();
    return;
  }

  panel.innerHTML = "";
  const names = [...new Set(sharedList.map(s => s.ownerPseudo))];
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = `Partagé par ${names.length} membre${names.length>1?"s":""} · lecture seule`;
  panel.appendChild(hint);

  const refresh = document.createElement("button");
  refresh.type = "button";
  refresh.className = "value-btn small";
  refresh.style.cssText = "width:auto;display:inline-block;margin-bottom:14px;";
  refresh.textContent = "Actualiser";
  refresh.onclick = () => { sharedLoaded = false; renderShared(); };
  panel.appendChild(refresh);

  renderTradeSuggestions(panel, byId, suggestions);

  for (const s of sharedList){
    const isWish = s.scopeKey === "wishlist";
    const cardsList = isWish ? s.items.map(id => byId[id]).filter(Boolean) : null;
    const tradeList = isWish ? null : s.items.filter(e => byId[e.id]);
    const count = isWish ? cardsList.length : tradeList.length;
    if (!count) continue;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<span>${esc(s.scopeLabel)} de ${esc(s.ownerPseudo)}</span><small>${count}</small>`;
    panel.appendChild(head);

    if (isWish){
      const grid = document.createElement("div");
      grid.className = "grid";
      sortCards(cardsList).forEach(c => grid.appendChild(cardButton(c)));
      panel.appendChild(grid);
    } else {
      const list = document.createElement("div");
      list.className = "trade-list";
      tradeList.forEach(e => {
        const card = byId[e.id];
        list.appendChild(tradeRow(card, e.v, e.x, `${e.x} en trop`));
      });
      panel.appendChild(list);
    }
  }
}

let loadingStats = false;
async function renderStats(){
  const ids = Object.keys(owned);
  if (!ids.length){
    content.innerHTML = emptyMsg(ICONS.chart, "Ta collection est vide pour l'instant.<br>Les statistiques apparaîtront une fois que tu auras ajouté des cartes.");
    return;
  }
  if (!blocksReady){
    content.innerHTML = `<div class="msg"><div class="spin"></div>Préparation des statistiques…</div>`;
    return; // loadBlocks() relance l'affichage une fois prêt
  }
  if (loadingStats) return;
  const todo = ids.filter(metaStale);
  if (todo.length){
    loadingStats = true;
    content.innerHTML = `<div class="msg"><div class="spin"></div>Calcul des statistiques…</div>`;
    await fetchMissingMeta(ids, (done, total) => {

    });

// nombre de cartes possédées par bloc, comparé au nombre RÉEL de cartes du bloc (secrètes
// incluses) — le nombre "officiel" (le YYY imprimé) exclut les cartes secrètes/spéciales
// au-delà de ce numéro, ce qui donnait des ratios impossibles (ex. 100/86) dès qu'on en possédait.
function blockProgress(ids){
  const haveBySet = {};
  for (const id of ids){
    const sid = id.slice(0, id.lastIndexOf("-")) || id;
    haveBySet[sid] = (haveBySet[sid] || 0) + 1;
  }
  return blocks
    .map(b => {
      const sets = b.sets
        .map(s => ({
          id: s.id,
          name: s.name,
          have: haveBySet[s.id] || 0,
          total: parseInt(setTotalById[s.id], 10) || 0,
        }))
        .filter(s => s.total > 0);
      const have = sets.reduce((sum, s) => sum + s.have, 0);
      const total = sets.reduce((sum, s) => sum + s.total, 0);
      return { name: b.name, have, total, sets };
    })
    .filter(b => b.total > 0);
}

// nombre de cartes possédées par rareté
function rarityBreakdown(ids){
  const counts = {};
  for (const id of ids){
    const r = rarityByCard[id] || "Rareté inconnue";
    counts[r] = (counts[r] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderStatsContent(ids){
  content.innerHTML = "";

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = ids.length + " carte" + (ids.length > 1 ? "s" : "") + " différente" + (ids.length > 1 ? "s" : "") + " dans ta collection";
  content.appendChild(hint);

  const blockHead = document.createElement("div");
  blockHead.className = "section-head";
  blockHead.innerHTML = `<span>Progression par bloc</span>`;
  content.appendChild(blockHead);

  const blockStats = blockProgress(ids);
  const blockList = document.createElement("div");
  blockList.className = "stat-list";
  if (!blockStats.length){
    blockList.innerHTML = `<p class="hint">Pas encore de série reconnue par bloc.</p>`;
  } else {
    blockStats.forEach(b => {
      const pct = b.total ? Math.round(b.have / b.total * 100) : 0;
      const details = document.createElement("details");
      details.className = "stat-block";
      const summary = document.createElement("summary");
      summary.className = "stat-block-summary";
      summary.innerHTML =
        `<span class="stat-caret">${svgIco(ICONS.chevron, "ico ico-sm")}</span>
         <div class="stat-label">${b.name}</div>
         <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
         <div class="stat-value">${b.have} / ${b.total}</div>`;
      details.appendChild(summary);

      const sublist = document.createElement("div");
      sublist.className = "stat-sublist";
      b.sets.forEach(s => {
        const spct = s.total ? Math.round(s.have / s.total * 100) : 0;
        const subrow = document.createElement("button");
        subrow.type = "button";
        subrow.className = "stat-subrow";
        subrow.innerHTML =
          `<div class="stat-label">${s.name}</div>
           <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${spct}%"></div></div>
           <div class="stat-value">${s.have} / ${s.total}</div>`;
        subrow.onclick = () => selectSet(s.id);
        sublist.appendChild(subrow);
      });
      details.appendChild(sublist);
      blockList.appendChild(details);
    });
  }
  content.appendChild(blockList);

  const rarityHead = document.createElement("div");
  rarityHead.className = "section-head";
  rarityHead.innerHTML = `<span>Répartition par rareté</span>`;
  content.appendChild(rarityHead);
  const rarityHint = document.createElement("p");
  rarityHint.className = "hint";
  rarityHint.textContent = "Touche une rareté pour voir ces cartes dans « Ma collection ».";
  content.appendChild(rarityHint);

  const rarityStats = rarityBreakdown(ids);
  const rarityList = document.createElement("div");
  rarityList.className = "stat-list";
  const maxCount = Math.max(...rarityStats.map(([, n]) => n), 1);
  rarityStats.forEach(([name, count]) => {
    const pct = Math.round(count / maxCount * 100);
    // « Rareté inconnue » (infos de carte pas encore chargées) n'est pas filtrable → simple ligne
    const known = name !== "Rareté inconnue";
    const row = document.createElement(known ? "button" : "div");
    row.className = "stat-row" + (known ? " stat-link" : "");
    if (known){
      row.type = "button";
      row.title = "Voir mes cartes « " + name + " »";
      row.onclick = () => showCollectionByRarity(name);
    }
    row.innerHTML =
      `<div class="stat-label">${name}</div>
       <div class="stat-bar-track"><div class="stat-bar-fill rarity" style="width:${pct}%"></div></div>
       <div class="stat-value">${count}</div>`;
    rarityList.appendChild(row);
  });
  content.appendChild(rarityList);
}

function renderSetMenu(q){
  const nq = normalize(q);
  const item = s => `<div class="combo-item${s.id===currentSetId?" on":""}" data-id="${s.id}">${s.name}</div>`;
  if (!blocksReady){
    // liste à plat tant que les blocs ne sont pas chargés

    setMenu.innerHTML = items.length ? items.map(item).join("") : `<div class="combo-empty">Aucune série trouvée</div>`;
    return;
  }
  let html = "";
  for (const block of blocks){
    const matches = block.sets.filter(s => !nq || normalize(s.name).includes(nq));

    html += `<div class="combo-block">${block.name}</div>` + matches.map(item).join("");

// --- fenêtre "Mon compte" (connexion) ---
const inputStyle = "width:100%;font-family:inherit;font-weight:700;font-size:15px;color:var(--ink);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--field);-webkit-appearance:none;";

function renderAccountBody(){
  const body = document.getElementById("authBody");
  if (!body) return;
  if (currentUser){
    if (profileLoadFailed){
      // On ne sait pas si un pseudo existe déjà : ne surtout pas montrer le formulaire
      // d'enregistrement (il ferait croire à un nouveau compte et risquerait de créer un
      // second pseudo en plus de l'existant). On propose seulement de réessayer la lecture.
      body.innerHTML =
        `<p style="text-align:center;font-weight:800;margin:0 0 16px;">Connecté : ${currentUser.email || "compte Google"}</p>
         <p class="pricenote" style="text-align:left;margin:0 0 14px;">Impossible de vérifier ton profil (pseudo, partages) pour l'instant — vérifie ta connexion.</p>
         <button class="big-btn btn-add" id="btnRetryProfile" style="margin-bottom:14px;">Réessayer</button>
         <button class="big-btn btn-remove" id="btnLogout" style="margin-top:6px;">Se déconnecter</button>`;
      document.getElementById("btnRetryProfile").onclick = async () => {
        setAuthStatus("Nouvelle tentative…");
        await loadUserProfile();
        await loadMyGrants();
        await loadShareRequests();
        renderAccountBody();
        setAuthStatus(profileLoadFailed ? "Toujours impossible de vérifier ton profil." : "", !profileLoadFailed);
      };
      document.getElementById("btnLogout").onclick = () => signOut(auth);
      return;
    }
    const p = userProfile && userProfile.pseudo;
    // Un pseudo déjà enregistré s'affiche en lecture seule : il faut un geste explicite
    // (« Modifier ») pour ouvrir le champ, puis confirmer, plutôt que de pouvoir l'écraser
    // en un clic. Un tout premier pseudo (pas encore de p) reste direct : rien à perdre.
    const showPseudoForm = !p || pseudoEditing;
    let html = `<p style="text-align:center;font-weight:800;margin:0 0 16px;">Connecté : ${currentUser.email || "compte Google"}</p>`;
    if (showPseudoForm){
      html += `
       <div class="field">
         <label>Ton pseudo${p ? "" : " &mdash; à définir"}</label>
         <input id="pseudoInput" maxlength="20" autocomplete="off" spellcheck="false"
                placeholder="ex. sam_du_92" value="${p ? esc(p) : ""}" style="${inputStyle}">
         <p class="pricenote" style="text-align:left;margin-top:8px;">3 à 20 caractères : lettres, chiffres, - ou _. Visible par les autres membres pour te retrouver et te partager une collection.</p>
       </div>
       <div class="field-row" style="margin-bottom:14px;">
         <button class="big-btn btn-add" id="btnPseudo" style="flex:1;">${p ? "Confirmer le nouveau pseudo" : "Enregistrer le pseudo"}</button>
         ${p ? `<button type="button" class="big-btn" id="btnCancelPseudo" style="flex:0 0 auto;width:auto;background:var(--surface-2);color:var(--ink);">Annuler</button>` : ``}
       </div>`;
    } else {
      html += `
       <div class="field">
         <label>Ton pseudo</label>
         <div class="field-row" style="align-items:center;">
           <p style="flex:1;font-weight:800;font-size:15px;margin:0;">${esc(p)}</p>
           <button type="button" class="big-btn" id="btnEditPseudo" style="flex:0 0 auto;width:auto;background:var(--surface-2);color:var(--ink);">Modifier</button>
         </div>
       </div>`;
    }

    html += `<p class="pricenote" style="text-align:left;margin:0 0 14px;">Gère qui peut voir ta collection et tes demandes d'accès dans l'onglet « Partagé ».</p>`;
    html += `<button class="big-btn btn-remove" id="btnLogout" style="margin-top:6px;">Se déconnecter</button>`;
    body.innerHTML = html;

    if (showPseudoForm){
      document.getElementById("btnPseudo").onclick = async () => {
        const val = document.getElementById("pseudoInput").value;
        if (p && !confirm(`Changer ton pseudo en « ${(val || "").trim()} » ?\nLes autres te retrouveront désormais sous ce nouveau nom.`)) return;
        pseudoEditing = false; // en cas de succès, savePseudo() réaffiche déjà en lecture seule
        const ok = await savePseudo(val);
        if (!ok) pseudoEditing = true; // échec (pseudo invalide/pris) : on reste en édition, rien n'a changé à l'écran
      };
      const cancelBtn = document.getElementById("btnCancelPseudo");
      if (cancelBtn) cancelBtn.onclick = () => { pseudoEditing = false; renderAccountBody(); };
    } else {
      document.getElementById("btnEditPseudo").onclick = () => { pseudoEditing = true; renderAccountBody(); };
    }
    document.getElementById("btnLogout").onclick = () => signOut(auth);
    return;
  }
  body.innerHTML =
    `<button class="big-btn btn-add" id="btnGoogle" style="margin-bottom:18px;">Se connecter avec Google</button>
     <div class="field"><label>Email</label>
       <input id="authEmail" type="email" autocomplete="email" style="${inputStyle}"></div>
     <div class="field"><label>Mot de passe</label>
       <input id="authPass" type="password" autocomplete="current-password" style="${inputStyle}"></div>
     <div class="field-row">
       <button class="big-btn btn-add" id="btnLogin">Se connecter</button>
       <button class="big-btn" id="btnSignup" style="background:var(--surface-2);color:var(--ink);">Créer un compte</button>
     </div>`;
  document.getElementById("btnGoogle").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Connexion à Google…");
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const isNew = getAdditionalUserInfo(result)?.isNewUser;
      track(isNew ? "sign_up" : "login", { method: "google" });
    }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
  const email = () => document.getElementById("authEmail").value.trim();
  const pass  = () => document.getElementById("authPass").value;
  document.getElementById("btnLogin").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Connexion…");
    try { await signInWithEmailAndPassword(auth, email(), pass()); track("login", { method: "password" }); }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
  document.getElementById("btnSignup").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Création du compte…");
    try { await createUserWithEmailAndPassword(auth, email(), pass()); track("sign_up", { method: "password" }); }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
}

function authError(e){
  const c = (e && e.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password")) return "Email ou mot de passe incorrect.";
  if (c.includes("email-already-in-use")) return "Un compte existe déjà avec cet email. Connecte-toi.";
  if (c.includes("weak-password")) return "Mot de passe trop court (6 caractères minimum).";
  if (c.includes("invalid-email")) return "Email invalide.";
  if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "Connexion Google annulée.";
  if (c.includes("unauthorized-domain")) return "Connexion Google indisponible ici : à tester une fois la page hébergée (étape 4).";
  return "Erreur de connexion. Réessaie.";
}

// --- thème clair / sombre ---
// --- easter egg : appui long (1,2 s) sur la Pokéball → menu des pages expérimentales ---
// Volontairement invisible pour qui ne connaît pas le geste (pages Vinted / estimation gradée
// pas encore « officielles »). Un tap ailleurs referme le menu.
(function () {
  const wrap = document.querySelector(".egg-wrap"), menu = document.getElementById("eggMenu");
  if (!wrap || !menu) return;
  let timer = null;
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => { menu.hidden = false; }, 1200); };
  const disarm = () => clearTimeout(timer);
  wrap.addEventListener("pointerdown", (e) => { if (!menu.contains(e.target)) arm(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => wrap.addEventListener(ev, disarm));
  wrap.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("pointerdown", (e) => { if (!menu.hidden && !wrap.contains(e.target)) menu.hidden = true; });
})();

const THEME_KEY = "collection_pokemon_theme";
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#14161d" : "#f0eee9");
  // un seul bouton, dont l'icône reflète l'action : lune = passer au sombre, soleil = revenir au clair
  const btn = $("themeBtn");
  if (btn){
    btn.innerHTML = svgIco(theme === "dark" ? ICONS.sun : ICONS.moon);
    const label = theme === "dark" ? "Passer au thème clair" : "Passer au thème sombre";
    btn.title = label;
    btn.setAttribute("aria-label", label);
    btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  }
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");

// --- Bouton Retour (Android / navigateur) : historique interne ---
// Chaque écran (onglet, série, recherche, fiche carte, fenêtre compte, sous-onglet Partagé)
// est une entrée dans l'historique du navigateur : le bouton Retour revient à l'écran
// précédent au lieu de quitter l'appli. render() garde l'entrée courante à jour (replaceState),
// les « navigations » poussent une entrée avant de changer l'état (navPush). Une entrée « garde »
// est posée sous l'écran de départ : y arriver affiche « Appuie encore sur Retour pour quitter »
// et laisse 2 s pour un second appui, qui sort vraiment (plus rien en dessous) ; passé ce
// délai, l'écran courant est reposé et on reste dans l'appli.
let navReady = false;      // vrai une fois l'écran de départ posé (fin d'init)
let navApplying = false;   // vrai pendant qu'on rejoue un état venu de l'historique
let navSeq = 0;            // deux appuis rapides : seul le dernier état rejoué compte
let exitTimer = null;
const EXIT_DELAY_MS = 2000;

function navSnapshot(){
  return { app: 1, view, setId: currentSetId, search, filter, sortBy, rarity: rarityFilter.slice(),
           sub: sharedSubTab, modal: openCard ? openCard.id : null,
           account: !$("syncOverlay").hidden };
}
function navPush(){ if (navReady && !navApplying) history.pushState(navSnapshot(), ""); }
function navReplace(){ if (navReady) history.replaceState(navSnapshot(), ""); }
function navInit(){
  const st = history.state;
  if (st && st.app && !st.guard){
    // Rechargement de la page (ex. le service worker recharge après une mise à jour) : l'entrée
    // courante est déjà un écran de l'appli, la garde est déjà en dessous → on reprend l'entrée
    // en place au lieu d'empiler une 2e garde (sinon il fallait 3 appuis pour sortir).
    history.replaceState(navSnapshot(), "");
  } else {
    history.replaceState({ app: 1, guard: true }, "");
    history.pushState(navSnapshot(), "");
  }
  navReady = true;
}
// carte à rouvrir dans la fiche : d'abord ce qui est déjà chargé, sinon l'API
async function findCard(id){
  const local = cards.find(c => c.id === id) || (allCards || []).find(c => c.id === id);
  if (local) return local;
  try {
    const d = await (await fetch(API + "/cards/" + id)).json();
    return d && d.id ? { id: d.id, localId: d.localId, name: d.name, image: d.image } : null;
  } catch { return null; }
}
// rejoue un écran venu de l'historique
async function navApply(st){
  const seq = ++navSeq;
  navApplying = true;
  try {
    if (!st.account) closeAccount();
    if (!st.modal && openCard) closeModal();
    view = st.view || "set";
    search = st.search || ""; searchInput.value = search; clearBtn.hidden = !search;
    filter = st.filter || "all";
    sortBy = st.sortBy || "num-asc"; $("sortSel").value = sortBy;
    sharedSubTab = st.sub || "feed";
    setRarityFilter(st.rarity || []);
    if (st.setId && st.setId !== currentSetId){
      currentSetId = st.setId;
      setInput.value = setNameById[st.setId] || st.setId;
      content.innerHTML = `<div class="msg"><div class="spin"></div>Chargement des cartes…</div>`;
      const ok = await fetchSetCards(st.setId);
      if (seq !== navSeq) return; // un autre appui est arrivé entre-temps
      if (!ok){ content.innerHTML = emptyMsg(ICONS.cards, "Impossible de charger cette série. Réessaie."); return; }
    }
    render();
    if (st.modal && (!openCard || openCard.id !== st.modal)){
      const c = await findCard(st.modal);
      if (seq !== navSeq) return;
      if (c) openModal(c);
    }
    if (st.account && $("syncOverlay").hidden) openAccount();
  } finally {
    if (seq === navSeq) navApplying = false;
  }
}
function showExitHint(on){
  let el = $("exitHint");
  if (!el){
    el = document.createElement("div");
    el.id = "exitHint"; el.className = "exit-hint";
    el.textContent = "Appuie encore sur Retour pour quitter";
    document.body.appendChild(el);
  }
  el.hidden = !on;
}
window.addEventListener("popstate", (e) => {
  const st = e.state;
  if (!st || !st.app) return; // entrée qui n'est pas à nous : on laisse faire le navigateur
  if (st.guard){
    // écran de départ atteint : on prévient, et on repose l'écran si pas de 2e appui
    showExitHint(true);
    clearTimeout(exitTimer);
    exitTimer = setTimeout(() => { history.pushState(navSnapshot(), ""); showExitHint(false); }, EXIT_DELAY_MS);
    return;
  }
  clearTimeout(exitTimer); showExitHint(false);
  navApply(st);
});

init();
</script>
<script>
// --- Enregistrement du service worker (mode appli + hors-ligne) ---
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      if (reg.waiting) showUpdateBar(); // une nouvelle version attendait déjà
      // Une nouvelle version est disponible : on prévient et on recharge après accord.
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            showUpdateBar();
          }
        });
      });
    }).catch(() => { /* pas de service worker : l'appli fonctionne normalement */ });

    // Rechargement une fois la nouvelle version active
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  });
}

function showUpdateBar() {
  if (document.getElementById("updateBar")) return;
  const bar = document.createElement("div");
  bar.id = "updateBar";
  bar.innerHTML = `<span>Nouvelle version disponible</span><button id="updateBtn">Mettre à jour</button>`;
  Object.assign(bar.style, {
    position: "fixed", left: "16px", right: "16px", bottom: "16px", zIndex: 100,
    background: "#1c2333", color: "#fff", borderRadius: "14px", padding: "13px 16px",
    display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px",
    fontFamily: "system-ui, sans-serif", fontWeight: "700", fontSize: "14px",
    boxShadow: "0 10px 30px rgba(0,0,0,.3)", maxWidth: "520px", margin: "0 auto",
  });
  document.body.appendChild(bar);
  const btn = document.getElementById("updateBtn");
  Object.assign(btn.style, {
    background: "#ffcb3d", color: "#1a1d29", border: "none", borderRadius: "9px",
    padding: "8px 14px", fontFamily: "inherit", fontWeight: "800", fontSize: "13px",
    cursor: "pointer", flex: "none",
  });
  btn.onclick = () => {
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (reg && reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      else location.reload();
    });
    bar.remove();
  };
}
// --- Bouton d'installation (Android/Chrome natif, instructions sur iPhone) ---
(function () {
  const btn = document.getElementById("installBtn");
  if (!btn) return;

  // Déjà installée ? On ne propose rien.
  const installed = window.matchMedia("(display-mode: standalone)").matches
    || navigator.standalone === true;
  if (installed) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  let deferred = null;

  // Android / Chrome : le navigateur nous signale que l'installation est possible
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();     // on garde la main pour déclencher via notre bouton
    deferred = e;
    btn.hidden = false;
  });

  window.addEventListener("appinstalled", () => {
    btn.hidden = true;
    deferred = null;
  });

  // iPhone : aucun signal n'existe, on affiche le bouton pour expliquer la marche à suivre
  if (isIOS) btn.hidden = false;

  btn.onclick = async () => {
    if (deferred) {
      deferred.prompt();
      const choice = await deferred.userChoice;
      deferred = null;
      if (choice && choice.outcome === "accepted") btn.hidden = true;
      return;
    }
    showIosHelp();
  };

  function showIosHelp() {
    if (document.getElementById("iosHelp")) return;
    const ov = document.createElement("div");
    ov.id = "iosHelp";
    ov.className = "overlay";
    ov.innerHTML =
      `<div class="modal" role="dialog" aria-modal="true">
         <button class="modal-close" aria-label="Fermer">&times;</button>
         <h2 class="modal-name">Installer l'application</h2>
         <p class="modal-meta">Sur iPhone et iPad, l'installation passe par le menu de partage de Safari.</p>
         <ol class="ios-steps">
           <li>Touche le bouton <strong>Partager</strong> en bas de Safari (le carré avec une flèche vers le haut).</li>
           <li>Fais défiler, puis choisis <strong>« Sur l'écran d'accueil »</strong>.</li>
           <li>Confirme avec <strong>Ajouter</strong>.</li>
         </ol>
         <p class="pricenote">L'icône apparaîtra ensuite sur ton écran d'accueil.</p>
       </div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector(".modal-close").onclick = close;
    ov.onclick = (e) => { if (e.target === ov) close(); };
  }
})();
</script>
