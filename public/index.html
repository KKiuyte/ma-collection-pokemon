<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f0eee9" />
<script>
// appliqué avant le CSS pour éviter un flash de mauvais thème au chargement
(function(){
  try {
    var t = localStorage.getItem("collection_pokemon_theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<title>Ma Collection Pokémon</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ma Collection" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
* { box-sizing: border-box; }
:root {
  /* couleurs de marque : fixes, ne changent pas avec le thème */
  --gold:#ffcb3d; --gold-deep:#e6a700; --navy:#1c2333;
  --accent:#ff8a00; --accent-deep:#e67a00;
  --ink-solid:#1a1d29; /* texte sur fond doré/orange : toujours sombre, même en thème sombre */

  /* neutres : basculent avec le thème */
  --ink:#1a1d29; --muted:#8a8f9c; --bg:#f0eee9; --surface:#fff;
  --line:rgba(0,0,0,.08); --field:#f6f7fa;
  --surface-2:#f1f2f6; --surface-3:#fbfbfc; --surface-accent:#fffdf4;
  --track:#e6e4de; --hairline:#f2f3f6; --chip-fg:#5b6170;
  --placeholder:#a7abb8; --noimg:#9aa2b1;
  --danger-bg:#fff0ef; --danger-fg:#d0392b; --danger-border:#ffd9d5;
  --wish-bg:#fff0f4; --wish-fg:#d63a6b; --wish-border:#ffd3e0;
}
:root[data-theme="dark"] {
  --ink:#eef0f4; --muted:#9aa3b5; --bg:#14161d; --surface:#1f2230;
  --line:rgba(255,255,255,.1); --field:#242735;
  --surface-2:#2a2e3d; --surface-3:#242735; --surface-accent:#2e2a1c;
  --track:#333748; --hairline:rgba(255,255,255,.08); --chip-fg:#aab0c2;
  --placeholder:#7d8296; --noimg:#7d8296;
  --danger-bg:#3a2020; --danger-fg:#ff8b7f; --danger-border:#5a2b28;
  --wish-bg:#3a1f2a; --wish-fg:#ff85ab; --wish-border:#5a2a3a;
}
body {
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg); margin:0; padding:20px 16px 64px; min-height:100vh;
}
.wrap { max-width:1100px; margin:0 auto; }

/* --- en-tête --- */
.head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.ball { width:30px; height:30px; border-radius:50%; flex:none; position:relative;
  background:linear-gradient(to bottom,#e63946 50%,#fff 50%); border:2.5px solid var(--ink-solid); }
.ball::before { content:""; position:absolute; left:-2.5px; right:-2.5px; top:50%; height:2.5px;
  background:var(--ink-solid); transform:translateY(-50%); }
.ball::after { content:""; position:absolute; width:9px; height:9px; border-radius:50%;
  background:#fff; border:2.5px solid var(--ink-solid); top:50%; left:50%; transform:translate(-50%,-50%); }
.head-text { flex:1; min-width:0; }
.title { font-size:20px; font-weight:800; letter-spacing:-.3px; line-height:1.1; }
.sub { font-size:12.5px; color:var(--muted); font-weight:600; margin-top:3px; }

/* icônes SVG : trait fin, couleur héritée du bouton parent */
.ico { width:20px; height:20px; display:block; margin:auto; flex:none; }
.ico-sm { width:15px; height:15px; }

.syncbtn { width:38px; height:38px; border:none; border-radius:50%; background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.1); cursor:pointer; line-height:1; display:grid;
  place-items:center; color:var(--ink); flex:none; }
.syncbtn.on { background:var(--gold); color:var(--ink-solid); }
.syncbtn:active { transform:scale(.92); }
.installbtn { width:38px; height:38px; border:none; border-radius:50%; background:var(--gold);
  box-shadow:0 1px 3px rgba(0,0,0,.12); cursor:pointer; display:grid; place-items:center;
  line-height:1; color:var(--ink-solid); flex:none; }
.installbtn:active { transform:scale(.92); }
.installbtn[hidden] { display:none; }

/* --- onglets de vue (Série / Collection / Statistiques / Échange) --- */
/* défilement horizontal plutôt que retour à la ligne : reste propre même avec un onglet en plus */
.tabs { display:flex; gap:4px; background:var(--surface-2); border-radius:12px; padding:4px;
  margin-bottom:10px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:1 0 auto; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
  padding:9px 13px; border-radius:9px; border:none; background:none; color:var(--chip-fg);
  white-space:nowrap; transition:background .15s ease, color .15s ease; }
.tab.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.tab:active { opacity:.7; }
.ios-steps { margin:0 0 4px; padding-left:20px; font-size:14px; font-weight:600; line-height:1.55; }
.ios-steps li { margin-bottom:9px; }

/* --- mise en page : barre latérale + grille --- */
.layout { display:flex; gap:18px; align-items:flex-start; }
.controls { flex:0 0 244px; background:var(--surface); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  position:sticky; top:16px; }
#content { flex:1; min-width:0; }

.ctrl-label { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); margin-bottom:6px; }
.divider { height:1px; background:var(--line); }

/* --- sections de commandes (Navigation / Filtres) --- */
.ctrl-section { display:flex; flex-direction:column; gap:14px; }
/* un contrôle n'apparaît que s'il agit sur l'onglet actif : sinon on le retire vraiment.
   (ces éléments ont un display explicite qui masquerait l'attribut `hidden` natif) */
.ctrl-section[hidden], .filters[hidden], .ctrl-hint[hidden] { display:none; }
.ctrl-heading { font-size:11px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink); }
.ctrl-hint { display:flex; align-items:flex-start; gap:6px; font-size:11.5px; font-weight:600;
  color:var(--muted); margin:0; line-height:1.35; }
.ctrl-hint svg { margin-top:1px; flex:none; color:var(--accent); }

/* --- sélecteur de série (avec recherche) --- */
.combo { position:relative; }
#setInput { width:100%; font-family:inherit; font-weight:700; font-size:13.5px; color:var(--ink);
  padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--field);
  -webkit-appearance:none; appearance:none; }
#setInput:focus { outline:none; border-color:var(--accent); }
.combo-menu { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; max-height:300px; overflow-y:auto;
  box-shadow:0 12px 30px rgba(0,0,0,.12); }
.combo-menu[hidden] { display:none; }
.combo-item { padding:11px 13px; font-weight:700; font-size:14px; cursor:pointer;
  border-bottom:1px solid var(--hairline); }
.combo-item:last-child { border-bottom:none; }
.combo-item.on { color:var(--accent-deep); }
.combo-item:active { background:var(--field); }
.combo-block { padding:11px 13px 4px; font-size:10.5px; font-weight:900; text-transform:uppercase;
  letter-spacing:.05em; color:var(--accent-deep); background:var(--surface-3); }
.combo-empty { padding:13px; color:var(--muted); font-weight:700; text-align:center; }

/* --- progression --- */
.bar { height:6px; background:var(--track); border-radius:3px; overflow:hidden; margin-top:9px; }
.fill { height:100%; width:0; background:var(--accent); border-radius:3px;
  transition:width .5s cubic-bezier(.2,.8,.2,1); }
.count { font-size:11px; color:var(--muted); font-weight:700; margin-top:5px; }

/* --- recherche --- */
.searchbar { position:relative; }
.searchbar input { width:100%; font-family:inherit; font-weight:600; font-size:13.5px; color:var(--ink);
  padding:9px 32px 9px 30px; border-radius:10px; border:1px solid var(--line); background:var(--field);
  -webkit-appearance:none; }
.searchbar input:focus { outline:none; border-color:var(--accent); }
.searchbar input::placeholder { color:var(--placeholder); font-weight:600; }
.search-ic { position:absolute; left:9px; top:50%; transform:translateY(-50%); display:grid;
  color:var(--placeholder); pointer-events:none; }
.clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:24px; height:24px;
  border:none; border-radius:50%; background:var(--track); color:var(--muted); font-size:16px;
  font-weight:900; cursor:pointer; line-height:1; }
.clear[hidden] { display:none; }

/* --- filtres --- */
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.chip { font-family:inherit; font-weight:600; font-size:12.5px; cursor:pointer; padding:7px 12px;
  border-radius:20px; border:none; background:var(--surface-2); color:var(--chip-fg); transition:.15s; white-space:nowrap; }
.chip.on { background:var(--navy); color:#fff; }

/* --- sélecteurs rareté / tri --- */
.ctrl-select { width:100%; font-family:inherit; font-weight:600; font-size:13.5px; color:var(--ink);
  padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--field);
  -webkit-appearance:none; appearance:none; }
.ctrl-select:focus { outline:none; border-color:var(--accent); }

/* --- statistiques --- */
.stat-list { display:flex; flex-direction:column; gap:11px; margin:0 2px 22px; }
.stat-row { display:grid; grid-template-columns:1fr 120px auto; align-items:center; gap:12px;
  grid-template-areas:"label bar value"; }
/* les noms longs (« Jeu de Cartes à Collectionner Pokémon Pocket ») passent à la ligne
   au lieu d'être coupés par des points de suspension */
.stat-label { grid-area:label; font-size:13.5px; font-weight:700; line-height:1.3;
  overflow-wrap:anywhere; }
.stat-bar-track { grid-area:bar; background:var(--track); border-radius:6px; height:10px; overflow:hidden; }
.stat-bar-fill { background:var(--accent); height:100%; border-radius:6px; min-width:3px; transition:width .4s ease; }
.stat-bar-fill.rarity { background:var(--ink); }
.stat-value { grid-area:value; font-size:12.5px; font-weight:800; color:var(--muted);
  white-space:nowrap; text-align:right; min-width:56px; }

.stat-block { border-bottom:1px solid var(--line); padding-bottom:11px; }
.stat-block-summary { display:grid; grid-template-columns:16px 1fr 120px auto; align-items:center;
  gap:12px; cursor:pointer; list-style:none; padding:2px 0;
  grid-template-areas:"caret label bar value"; }
.stat-block-summary::-webkit-details-marker { display:none; }
.stat-caret { grid-area:caret; color:var(--muted); transition:transform .15s ease;
  display:grid; place-items:center; }
.stat-block[open] .stat-caret { transform:rotate(90deg); }
.stat-sublist { display:flex; flex-direction:column; gap:9px; margin:11px 0 0 28px; }
.stat-subrow { display:grid; grid-template-columns:1fr 120px auto; align-items:center; gap:12px;
  grid-template-areas:"label bar value";
  width:100%; font-family:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left; }
.stat-subrow .stat-label { color:var(--accent-deep); }
.stat-subrow:active { opacity:.6; }

/* --- grille de cartes --- */
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); }
.slot { position:relative; cursor:pointer; border-radius:11px; aspect-ratio:63/88; border:none;
  padding:0; background:none; transition:transform .12s ease; }
.slot:active { transform:scale(.94); }
.slot img { width:100%; height:100%; object-fit:contain; border-radius:9px; display:block; }
.slot.owned { box-shadow:0 0 0 2.5px var(--gold), 0 4px 12px rgba(255,203,61,.3); }
.slot.wish { box-shadow:0 0 0 2.5px #ff5c8a, 0 4px 12px rgba(255,92,138,.25); }
.check { position:absolute; top:-6px; right:-6px; width:22px; height:22px; background:var(--gold);
  color:var(--ink); border-radius:50%; display:grid; place-items:center; font-weight:800;
  font-size:12px; box-shadow:0 2px 5px rgba(0,0,0,.2); }
.wishbadge { position:absolute; top:-6px; right:-6px; width:22px; height:22px; background:#ff5c8a;
  color:#fff; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:12px;
  box-shadow:0 2px 5px rgba(0,0,0,.2); }
.qtybadge { position:absolute; top:-6px; left:-6px; min-width:20px; height:20px; padding:0 5px;
  background:var(--navy); color:#fff; border-radius:10px; display:grid; place-items:center;
  font-weight:800; font-size:10.5px; box-shadow:0 2px 5px rgba(0,0,0,.2); }
.num { position:absolute; bottom:5px; left:5px; font-size:10px; font-weight:800; color:#fff;
  background:rgba(26,29,41,.8); padding:1px 6px; border-radius:6px;
  font-family:ui-monospace,Menlo,monospace; }
.noimg { width:100%; height:100%; display:grid; place-items:center; font-size:11px; font-weight:800;
  color:var(--noimg); padding:6px; text-align:center; }

/* --- messages, sections --- */
/* les messages (vide, chargement, erreur) : icône + texte centrés.
   La hauteur minimale qui les centre dans l'espace disponible est réservée au desktop
   (voir fin de feuille) : sur mobile le panneau empilé occupe déjà le haut de l'écran. */
.msg { display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:32px 16px; color:var(--muted); font-weight:700; }
/* discrète mais visible dans les deux thèmes (le jeton s'adapte, l'opacité l'atténue) */
.msg-ico { width:44px; height:44px; color:var(--placeholder); opacity:.5; flex:none; }
.spin { width:26px; height:26px; margin:0 auto 12px; border-radius:50%;
  border:3px solid var(--track); border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.section-head { display:flex; align-items:baseline; gap:10px; margin:22px 2px 12px;
  padding-bottom:8px; border-bottom:1px solid var(--line); }
.section-head span { font-weight:900; font-size:15px; color:var(--ink); }
.section-head small { font-weight:800; font-size:11px; color:#fff; background:var(--accent);
  padding:2px 9px; border-radius:999px; }
.hint { font-size:13px; font-weight:700; color:var(--muted); margin:0 0 12px 2px; }

/* --- fiche carte & compte (modales) --- */
.overlay { position:fixed; inset:0; background:rgba(20,25,40,.55); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px; }
.overlay[hidden] { display:none; }
.modal { background:var(--surface); border-radius:20px; padding:20px; width:100%; max-width:360px;
  max-height:90vh; overflow-y:auto; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:pop .25s ease; }
@keyframes pop { 0%{transform:scale(.94)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
.modal-close { position:absolute; right:12px; top:12px; width:32px; height:32px; border:none;
  border-radius:50%; background:var(--surface-2); color:var(--muted); font-size:20px; font-weight:900;
  cursor:pointer; line-height:1; z-index:2; }
.modal-img { text-align:center; margin:4px 0 14px; }
.modal-img img { max-width:54%; max-height:31vh; border-radius:10px; box-shadow:0 10px 26px rgba(0,0,0,.18); }
.modal-name { font-weight:900; font-size:19px; margin:0 0 2px; text-align:center; }
.modal-meta { color:var(--muted); font-weight:700; font-size:13.5px; margin:0 0 14px; text-align:center; }
.rarity-tag { display:inline-block; background:var(--navy); color:#fff; font-weight:800;
  font-size:11.5px; padding:2px 10px; border-radius:999px; margin-left:4px; vertical-align:1px; }
.big-btn { width:100%; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer;
  padding:14px; border-radius:12px; border:none; }
.btn-add { background:var(--gold); color:var(--ink-solid); }
.btn-remove { background:var(--danger-bg); color:var(--danger-fg); border:1px solid var(--danger-border); margin-top:14px; }
.btn-wish { background:var(--wish-bg); color:var(--wish-fg); border:1px solid var(--wish-border); margin-top:12px; }
.owned-tag { text-align:center; font-weight:800; color:var(--accent-deep); margin:0 0 12px; }
.field { margin-bottom:14px; }
.field-row { display:flex; gap:12px; }
.field-row .field { flex:1; min-width:0; }
.field > label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); display:block; margin-bottom:8px; }
.field select { width:100%; font-family:inherit; font-weight:700; font-size:14px; color:var(--ink);
  padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--field);
  -webkit-appearance:none; appearance:none; }
/* --- versions d'une carte --- */
.vlist { display:flex; flex-direction:column; gap:12px; }
.vcard { border:1px solid var(--line); border-radius:14px; padding:13px; background:var(--surface-3); }
.vcard.has { border-color:var(--gold); background:var(--surface-accent); }
.vhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.vname { font-weight:900; font-size:14.5px; }
.vright { display:flex; align-items:center; gap:8px; }
.vprice { font-weight:900; font-size:13.5px; color:var(--accent-deep); }
.cardvalue { color:var(--accent-deep); }

/* --- exemplaires individuels d'une version --- */
.copy-list { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.copy-row { display:grid; grid-template-columns:18px 1fr 1fr 30px; gap:7px; align-items:center; }
.copy-num { font-size:11px; font-weight:800; color:var(--muted); }
.copy-row select { width:100%; font-family:inherit; font-weight:600; font-size:12px; color:var(--ink);
  padding:7px 6px; border-radius:8px; border:1px solid var(--line); background:var(--field);
  -webkit-appearance:none; appearance:none; }
.copy-remove { width:28px; height:28px; border-radius:8px; border:1px solid var(--danger-border);
  background:var(--danger-bg); color:var(--danger-fg); font-size:15px; font-weight:900; cursor:pointer;
  line-height:1; flex:none; }
.copy-add-toggle { width:100%; font-family:inherit; font-weight:800; font-size:12.5px; cursor:pointer;
  padding:9px; border-radius:10px; border:1px dashed var(--line); background:none; color:var(--accent-deep); }
.copy-add-form { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.copy-add-form .field-row { margin-bottom:10px; }
.copy-add-form[hidden] { display:none; }
.pricenote { text-align:center; font-size:11.5px; font-weight:700; color:var(--muted);
  margin:12px 0 0; }

/* --- valeur estimée de la collection --- */
.value-amount { font-size:21px; font-weight:900; color:var(--accent-deep); line-height:1.15; }
.value-note { font-size:11px; font-weight:700; color:var(--muted); margin-top:3px; }
.value-btn { font-family:inherit; font-weight:800; font-size:13.5px; cursor:pointer; width:100%;
  padding:10px; border-radius:10px; border:none; background:var(--gold); color:var(--ink-solid);
  margin-top:8px; }
.value-btn.small { font-size:12px; padding:7px; background:var(--field); color:var(--muted);
  border:1px solid var(--line); }
.value-msg { font-size:12.5px; font-weight:700; color:var(--muted); display:flex;
  align-items:center; gap:8px; padding:4px 0; }
.mini-spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--track);
  border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; }
.vqty { font-weight:800; font-size:12px; color:#fff; background:var(--navy);
  padding:2px 9px; border-radius:999px; }
.vcard .big-btn { padding:11px; font-size:14px; }
.vcard .field { margin-bottom:10px; }

/* --- liste d'échange --- */
.trade-list { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.trade-row { display:flex; align-items:center; gap:12px; padding:9px 11px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface-3); cursor:pointer; width:100%;
  font-family:inherit; text-align:left; }
.trade-row:active { opacity:.7; }
.trade-row img { width:38px; border-radius:6px; flex:none; display:block; }
.trade-info { flex:1; min-width:0; }
.trade-name { font-weight:800; font-size:13.5px; color:var(--ink); }
.trade-version { font-size:12px; color:var(--muted); font-weight:600; }
.trade-badge { font-weight:900; font-size:11.5px; color:#fff; background:var(--navy);
  padding:4px 10px; border-radius:999px; flex:none; white-space:nowrap; }

/* --- partage : autoriser par pseudo (fenêtre Mon compte) --- */
.grant-row { display:flex; gap:8px; align-items:stretch; }
.grant-input { flex:1; min-width:0; font-family:inherit; font-weight:700; font-size:14px; color:var(--ink);
  padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--field); -webkit-appearance:none; }
.grant-input:focus { outline:none; border-color:var(--accent); }
.grant-input::placeholder { color:var(--placeholder); font-weight:600; }
.grant-btn { flex:none; font-family:inherit; font-weight:800; font-size:13px; cursor:pointer;
  padding:0 15px; border-radius:10px; border:none; background:var(--gold); color:var(--ink-solid); }
.grant-btn:active { opacity:.8; }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiGgrj28Jrqn8jEGM9pWFsVhnfs-VKyiU",

};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

const API = "https://api.tcgdex.net/v2/fr";
const KEY = "collection_pokemon_v1";
const WISH_KEY = "collection_pokemon_wishlist";
const CONDITIONS = ["Neuve", "Excellent", "Très bon", "Bon", "Moyen", "Mauvais"];
const DEFAULT_VARIANT = "Normale";
// correspondance entre les versions renvoyées par TCGdex et leur nom en français
const VARIANT_LABELS = {
  normal: "Normale",
  reverse: "Reverse Holo",
  holo: "Holo",
  firstEdition: "1re édition",
  wPromo: "Promo",
};
const VARIANT_ORDER = ["Normale", "Reverse Holo", "Holo", "1re édition", "Promo"];
const variantCache = {}; // idCarte -> liste des versions disponibles
const rarityByCard = {}; // idCarte -> rareté (récupérée avec les versions)
const pricingByCard = {}; // idCarte -> données de prix (Cardmarket / TCGplayer)
const metaTs = {};       // idCarte -> date de récupération (pour le rafraîchissement quotidien)
const META_KEY = "collection_pokemon_meta";   // cache local des versions/raretés/prix
const VALUE_KEY = "collection_pokemon_value"; // dernière valeur totale calculée
const PRICE_TTL = 24 * 3600 * 1000;           // prix rafraîchis une fois par jour
const LANGUAGES = ["Français", "Anglais", "Japonais", "Allemand", "Italien", "Espagnol", "Chinois", "Autre"];

// --- petites icônes SVG (trait fin, couleur héritée via currentColor) ---
const svgIco = (paths, cls = "ico") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"`
  + ` stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICONS = {
  moon: `<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>`,
  sun: `<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.6 12H2.4M21.6 12h-2.2`
     + `M6.8 6.8 5.2 5.2M18.8 18.8l-1.6-1.6M17.2 6.8l1.6-1.6M5.2 18.8l1.6-1.6"/>`,
  chevron: `<path d="M9 5l7 7-7 7"/>`,
  cards: `<rect x="3" y="7" width="12.5" height="14" rx="2"/><path d="M8 3.5h11a1.5 1.5 0 0 1 1.5 1.5v12"/>`,
  search: `<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>`,
  heart: `<path d="M12 20s-7-4.3-7-9.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.9C19 15.7 12 20 12 20Z"/>`,
  swap: `<path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/>`,
  chart: `<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>`,
};
// message d'état (vide, erreur) : icône discrète + texte, centré dans l'espace disponible
const emptyMsg = (icon, html) => `<div class="msg">${svgIco(icon, "msg-ico")}<div>${html}</div></div>`;
let owned = load();
let wishlist = loadWishlist(); // { idCarte: true } des cartes "à acheter"
let cards = [];
let filter = "all";
let sortBy = "num-asc";   // tri courant
let rarityFilter = "";    // "" = toutes les raretés
let rarityIds = null;     // Set d'ids de la série courante ayant la rareté choisie (ou null)
let rarities = [];        // liste des raretés disponibles (pour le menu)
const rarityCache = {};   // "idSérie|rareté" -> Set d'ids (évite de re-demander)
let search = "";
let allCards = null;      // toutes les cartes (chargées à la 1re recherche)
let loadingAll = false;
// vue courante, pilotée par les onglets : "set" | "collection" | "stats" | "trade"
let view = "set";
let setList = [];         // liste des séries, plus récente en premier
const setNameById = {};   // id de série -> nom
const setOfficialById = {}; // id de série -> nombre de cartes "officiel" (le YYY imprimé)
let blocks = [];          // regroupement par bloc : [{ id, name, sets: [...] }]
const blockNameById = {}; // id de bloc -> nom
const setBlockById = {};  // id de série -> id de bloc
let blocksReady = false;  // structure des blocs chargée ?
let saveTimer = null;      // pour regrouper les sauvegardes en ligne
let currentUser = null;    // utilisateur connecté (null = déconnecté)
let userProfile = null;    // profil public { pseudo, pseudoLower, email } ou null
let cloudUnsub = null;     // pour arrêter l'écoute temps réel
let interactiveLogin = false; // connexion déclenchée par un clic (vs. session restaurée)
// pseudo : 3 à 20 caractères, lettres/chiffres/tiret/underscore
const PSEUDO_RE = /^[A-Za-z0-9_-]{3,20}$/;

// Périmètres partageables. Extensible : ajouter { key, col, label } (+ un bloc de règles
// Firestore) suffira pour publier plus tard la collection complète.
const SHARE_SCOPES = [
  { key: "wishlist", col: "shared_wishlist", label: "Souhaits" },
  { key: "trades",   col: "shared_trades",   label: "Échanges" },
];
let myGrants = { wishlist: [], trades: [] }; // qui j'autorise, par périmètre : [{uid, pseudo}]

// Format actuel : owned[idCarte] = { v: { "Normale": [ {cond,lang}, {cond,lang} ], "Reverse Holo": [...] } }
// Chaque exemplaire d'une version a son propre état et sa propre langue.
// Les anciens formats sont convertis automatiquement (tout devient la version "Normale").
function copyEntry(cond, lang){
  return { cond: cond || "Neuve", lang: lang || "Français" };
}
// fabrique `qty` exemplaires identiques (pour convertir les anciennes données groupées)
function makeCopies(qty, cond, lang){
  return Array.from({ length: Math.max(1, qty || 1) }, () => copyEntry(cond, lang));
}
function migrate(raw){
  const out = {};
  for (const id in raw){
    const v = raw[id];
    if (!v) continue;
    if (typeof v === "number"){                        // tout premier format
      out[id] = { v: { [DEFAULT_VARIANT]: makeCopies(v) } };
    } else if (v.v && typeof v.v === "object"){        // déjà au bon format (ou version par exemplaires)
      const vv = {};
      for (const name in v.v){
        const e = v.v[name];
        if (!e) continue;
        const copies = Array.isArray(e)
          ? e.map(cp => copyEntry(cp && cp.cond, cp && cp.lang))
          : makeCopies(e.qty, e.cond, e.lang);
        if (copies.length) vv[name] = copies;
      }
      if (Object.keys(vv).length) out[id] = { v: vv };
    } else if (typeof v === "object"){                 // format intermédiaire {qty,cond,lang}
      out[id] = { v: { [DEFAULT_VARIANT]: makeCopies(v.qty, v.cond, v.lang) } };
    }
  }
  return out;
}
function load(){
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { raw = {}; }
  return migrate(raw);
}
// quantité totale d'une carte, toutes versions confondues
function cardQty(rec){
  if (!rec || !rec.v) return 0;
  return Object.values(rec.v).reduce((n, copies) => n + (copies ? copies.length : 0), 0);
}
// nombre de versions différentes possédées pour une carte
function variantCount(rec){
  return rec && rec.v ? Object.keys(rec.v).length : 0;
}
function loadWishlist(){
  try { return JSON.parse(localStorage.getItem(WISH_KEY)) || {}; } catch { return {}; }
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(owned)); } catch {}
  try { localStorage.setItem(WISH_KEY, JSON.stringify(wishlist)); } catch {}
}
function save(){ saveLocal(); scheduleCloudSave(); }
// sauvegarde immédiate en ligne (pour l'ajout et le retrait)
function saveNow(){ saveLocal(); clearTimeout(saveTimer); saveCloud(); }

// --- connexion & stockage en ligne (Firebase) ---
function setAuthStatus(text, ok){
  const el = document.getElementById("authStatus");
  if (el){ el.textContent = text || ""; el.style.color = ok === false ? "#d0392b" : (ok ? "#2e9a4f" : "var(--muted)"); }
}
function updateAccountButton(){
  const b = document.getElementById("syncBtn");
  if (b) b.classList.toggle("on", !!currentUser);
}
async function saveCloud(){
  if (!currentUser) return;
  try {
    await setDoc(doc(db, "collections", currentUser.uid), { cards: owned, wishlist: wishlist, updatedAt: Date.now() });
    refreshPublishedShares(); // garde les copies partagées à jour (souhaits / échanges)
  } catch {
    // hors-ligne : Firestore renverra les données tout seul au retour de la connexion
  }
}
function scheduleCloudSave(){
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCloud, 1500);
}
// écoute en temps réel les changements venus des autres appareils
function listenCloud(){
  if (cloudUnsub) cloudUnsub();
  cloudUnsub = onSnapshot(doc(db, "collections", currentUser.uid), (snap) => {
    if (snap.metadata.hasPendingWrites) return; // ignore nos propres écritures
    const data = snap.exists() ? snap.data() : {};
    owned = migrate(data.cards || {});
    wishlist = data.wishlist || {};
    saveLocal(); render();
  });
}

// À la connexion : fusion initiale, puis écoute temps réel
async function onLogin(user){
  const interactive = interactiveLogin; interactiveLogin = false;
  currentUser = user;
  updateAccountButton();
  renderAccountBody();
  setAuthStatus("Connecté : " + (user.email || "compte Google"), true);
  await loadUserProfile();
  await loadMyGrants();
  renderAccountBody(); // ré-affiche avec le pseudo et les partages une fois chargés
  if (!userProfile || !userProfile.pseudo)
    setAuthStatus("Choisis un pseudo ci-dessous pour pouvoir partager ta collection plus tard.");
  try {
    const ref = doc(db, "collections", user.uid);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : null;
    const remote = data ? (data.cards || {}) : null;
    const remoteWish = data ? (data.wishlist || {}) : {};
    if (remote && Object.keys(remote).length){
      let replace = true;
      const differ = JSON.stringify(owned) !== JSON.stringify(remote);
      if (interactive && Object.keys(owned).length && differ){
        replace = confirm("Une collection existe déjà pour ce compte.\n\nOK = la charger sur cet appareil (remplace la collection locale).\nAnnuler = garder la collection locale et l'envoyer en ligne.");
      }
      if (replace){ owned = migrate(remote); wishlist = remoteWish; saveLocal(); }
      else { await saveCloud(); }
    } else {
      await saveCloud(); // rien en ligne : on envoie la collection locale
    }
    render();
  } catch {}
  listenCloud();
}

function onLogout(){
  if (cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
  currentUser = null;
  userProfile = null;
  myGrants = { wishlist: [], trades: [] };
  updateAccountButton();
  renderAccountBody();
  setAuthStatus("Déconnecté. Ta collection reste sur cet appareil.");
}

// --- pseudo (profil public, base du partage à venir) ---
async function loadUserProfile(){
  if (!currentUser){ userProfile = null; return; }
  try {
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    userProfile = snap.exists() ? snap.data() : null;
  } catch { userProfile = null; }
}

// Réserve un pseudo de façon atomique : le registre `pseudos/{minuscule}` garantit
// l'unicité (insensible à la casse) et sert plus tard à retrouver un compte par son pseudo.
async function savePseudo(raw){
  if (!currentUser) return false;
  const pseudo = (raw || "").trim();
  if (!PSEUDO_RE.test(pseudo)){
    setAuthStatus("Pseudo invalide : 3 à 20 caractères (lettres, chiffres, - ou _).", false);
    return false;
  }
  const lower = pseudo.toLowerCase();
  const oldLower = userProfile && userProfile.pseudoLower;
  setAuthStatus("Enregistrement du pseudo…");
  try {
    await runTransaction(db, async (tx) => {
      const claimRef = doc(db, "pseudos", lower);
      const claimSnap = await tx.get(claimRef);              // (lecture avant écritures)
      if (claimSnap.exists() && claimSnap.data().uid !== currentUser.uid)
        throw new Error("PSEUDO_TAKEN");
      if (oldLower && oldLower !== lower)                    // libère l'ancien pseudo
        tx.delete(doc(db, "pseudos", oldLower));
      tx.set(claimRef, { uid: currentUser.uid });
      tx.set(doc(db, "users", currentUser.uid),
             { pseudo, pseudoLower: lower, email: currentUser.email || null, updatedAt: Date.now() });
    });
    userProfile = { pseudo, pseudoLower: lower, email: currentUser.email || null };
    setAuthStatus("Pseudo enregistré : " + pseudo, true);
    renderAccountBody();
    return true;
  } catch (e){
    setAuthStatus(e.message === "PSEUDO_TAKEN"
      ? "Ce pseudo est déjà pris. Choisis-en un autre."
      : "Impossible d'enregistrer le pseudo. Réessaie.", false);
    return false;
  }
}

// --- partage : octroi d'accès par pseudo (étape 1b, côté propriétaire) ---
async function pseudoOf(uid){
  try { const s = await getDoc(doc(db, "users", uid)); return (s.exists() && s.data().pseudo) || "?"; }
  catch { return "?"; }
}
// charge, pour chaque périmètre, la liste des personnes que J'AI autorisées
async function loadMyGrants(){
  myGrants = { wishlist: [], trades: [] };
  if (!currentUser) return;
  for (const s of SHARE_SCOPES){
    try {
      const snap = await getDoc(doc(db, s.col, currentUser.uid));
      const viewers = snap.exists() ? (snap.data().viewers || []) : [];
      myGrants[s.key] = await Promise.all(viewers.map(async uid => ({ uid, pseudo: await pseudoOf(uid) })));
    } catch { myGrants[s.key] = []; }
  }
}
// données publiées pour un périmètre (jamais la collection complète pour "trades")
function shareData(key){
  if (key === "wishlist") return Object.keys(wishlist);
  if (key === "trades") return tradeEntries().map(e => ({ id: e.id, v: e.version, x: e.extra }));
  return [];
}
// publie (ou supprime si plus aucun autorisé) le document partagé d'un périmètre
async function publishScope(key){
  if (!currentUser) return;
  const s = SHARE_SCOPES.find(x => x.key === key);
  const ref = doc(db, s.col, currentUser.uid);
  const viewers = myGrants[key].map(g => g.uid);
  try {
    if (!viewers.length){ await deleteDoc(ref); return; }
    await setDoc(ref, {
      owner: currentUser.uid,
      ownerPseudo: (userProfile && userProfile.pseudo) || "Un membre",
      viewers, data: shareData(key), updatedAt: Date.now(),
    });
  } catch {}
}
// re-publie les périmètres partagés après une modif de collection (copies à jour)
async function refreshPublishedShares(){
  if (!currentUser) return;
  for (const s of SHARE_SCOPES) if (myGrants[s.key].length) await publishScope(s.key);
}
async function grantAccess(key, pseudoRaw){
  const pseudo = (pseudoRaw || "").trim();
  if (!pseudo) return;
  if (!PSEUDO_RE.test(pseudo)){ setAuthStatus("Pseudo invalide.", false); return; }
  const lower = pseudo.toLowerCase();
  if (userProfile && userProfile.pseudoLower === lower){ setAuthStatus("C'est ton propre pseudo.", false); return; }
  setAuthStatus("Recherche du pseudo…");
  let uid = null;
  try { const snap = await getDoc(doc(db, "pseudos", lower)); if (snap.exists()) uid = snap.data().uid; } catch {}
  if (!uid){ setAuthStatus("Aucun membre avec ce pseudo.", false); return; }
  if (myGrants[key].some(g => g.uid === uid)){ setAuthStatus("Cette personne a déjà accès.", false); return; }
  const realPseudo = await pseudoOf(uid);
  myGrants[key].push({ uid, pseudo: realPseudo });
  await publishScope(key);
  const label = SHARE_SCOPES.find(s => s.key === key).label.toLowerCase();
  setAuthStatus(`Accès à tes ${label} accordé à ${realPseudo}.`, true);
  renderAccountBody();
}
async function revokeAccess(key, uid){
  myGrants[key] = myGrants[key].filter(g => g.uid !== uid);
  await publishScope(key);
  renderAccountBody();
}

// enlève accents/majuscules pour une recherche souple
function normalize(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
// une carte correspond-elle à la recherche (nom OU numéro) ?
function matchesSearch(c){
  if (!search) return true;
  const q = normalize(search);
  const hasSlash = q.includes("/");

  // recherche par nom (sauf si on a tapé un "/", signe d'une recherche par numéro)
  if (!hasSlash && normalize(c.name).includes(q)) return true;

  // recherche par numéro : "066" ou "066/063"
  let numPart = q, totalPart = null;
  if (hasSlash){ const p = q.split("/"); numPart = p[0].trim(); totalPart = p[1].trim(); }
  if (!numPart) return false;

  const id = normalize(c.localId);
  const idClean = id.replace(/^0+/, ""), numClean = numPart.replace(/^0+/, "");

  if (totalPart){
    // le YYY est fourni : on cible la/les séries qui ont ce total, et match exact du numéro
    const sid = c.id.slice(0, c.id.lastIndexOf("-")) || c.id;
    const off = setOfficialById[sid];
    if (off != null && off !== totalPart.replace(/^0+/, "")) return false;
    return idClean === numClean || id === numPart;
  }
  // pas de YYY : correspondance progressive (au fur et à mesure de la frappe)
  return id.startsWith(numPart) || idClean.startsWith(numClean);
}

// --- cache local des infos de carte (versions, rareté, prix) ---
function hydrateMeta(){
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch { raw = {}; }
  for (const id in raw){
    const m = raw[id]; if (!m) continue;
    if (m.v) variantCache[id] = m.v;
    if (m.r) rarityByCard[id] = m.r;
    if (m.p) pricingByCard[id] = m.p;
    metaTs[id] = m.t || 0;
  }
}
function persistMeta(){
  const out = {};
  for (const id in metaTs){
    out[id] = { v: variantCache[id], r: rarityByCard[id], p: pricingByCard[id], t: metaTs[id] };
  }
  try { localStorage.setItem(META_KEY, JSON.stringify(out)); }
  catch { /* espace saturé : on garde le cache en mémoire seulement */ }
}
function metaStale(cardId){
  return !metaTs[cardId] || (Date.now() - metaTs[cardId] > PRICE_TTL);
}
// récupère versions + rareté + prix d'une carte (une requête)
async function fetchMeta(cardId){
  try {
    const data = await (await fetch(API + "/cards/" + encodeURIComponent(cardId))).json();
    const v = data && data.variants ? data.variants : {};
    const list = Object.keys(VARIANT_LABELS).filter(k => v[k]).map(k => VARIANT_LABELS[k]);
    variantCache[cardId] = list.length ? list : [DEFAULT_VARIANT];
    if (data && data.rarity) rarityByCard[cardId] = data.rarity;
    if (data && data.pricing) pricingByCard[cardId] = data.pricing;
    metaTs[cardId] = Date.now();
    return true;
  } catch {
    if (!variantCache[cardId]) variantCache[cardId] = [DEFAULT_VARIANT]; // repli
    return false;
  }
}

// versions et rareté d'une carte (récupérées une fois, puis mises en cache)
async function loadVariants(cardId){
  if (variantCache[cardId] && !metaStale(cardId)) return;
  if (variantCache[cardId] && pricingByCard[cardId]){
    // données présentes mais anciennes : on rafraîchit en arrière-plan sans bloquer l'affichage
    fetchMeta(cardId).then(() => {
      persistMeta();
      if (openCard && openCard.id === cardId){ updateModalMeta(); renderModalBody(); }
    });
    return;
  }
  await fetchMeta(cardId);
  persistMeta();
  if (openCard && openCard.id === cardId){ updateModalMeta(); renderModalBody(); }
}

// liste des versions à afficher : celles disponibles + celles déjà possédées
function variantsFor(cardId){
  const avail = variantCache[cardId] || null;
  const ownedNames = owned[cardId] && owned[cardId].v ? Object.keys(owned[cardId].v) : [];
  const set = new Set([...(avail || [DEFAULT_VARIANT]), ...ownedNames]);
  const list = [...set];
  list.sort((a, b) => {
    const ia = VARIANT_ORDER.indexOf(a), ib = VARIANT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return { list, loading: !avail };
}

// --- prix estimés (données TCGdex : Cardmarket en €, TCGplayer en $) ---
// On privilégie Cardmarket (marché européen), avec repli sur TCGplayer.
function priceForVariant(cardId, variantName){
  const p = pricingByCard[cardId];
  if (!p) return null;
  const cm = p.cardmarket, tp = p.tcgplayer;
  const num = (x) => (typeof x === "number" && isFinite(x) && x > 0) ? x : null;
  const avail = variantCache[cardId] || [];
  const hasNormal = avail.includes("Normale");
  const hasHolo = avail.includes("Holo");
  const isFoil = variantName === "Holo" || variantName === "Reverse Holo";

  if (cm){
    const base = () => num(cm.trend) ?? num(cm.avg) ?? num(cm.avg30);
    const holo = () => num(cm["trend-holo"]) ?? num(cm["avg-holo"]) ?? num(cm["avg30-holo"]);
    let v = null;
    if (!isFoil){
      v = base();                          // version non brillante
    } else if (!hasNormal){
      v = base() ?? holo();                // la carte n'existe qu'en brillant : le prix de base est le sien
    } else if (variantName === "Holo" || !hasHolo){
      v = holo();                          // version brillante d'une carte qui existe aussi en normal
    }
    if (v) return { value: v, unit: "EUR", source: "Cardmarket" };
  }
  // TCGplayer : sous-objets par version (normal / reverse / holo)
  if (tp){
    const key = variantName === "Reverse Holo" ? "reverse" : variantName === "Holo" ? "holo" : "normal";
    const b = tp[key] || tp.holo || tp.normal;
    if (b){
      const v = num(b.marketPrice) ?? num(b.midPrice) ?? num(b.lowPrice);
      if (v) return { value: v, unit: "USD", source: "TCGplayer" };
    }
  }
  return null;
}
function formatPrice(p){
  if (!p) return null;
  return p.value.toLocaleString("fr-FR", { style: "currency", currency: p.unit, maximumFractionDigits: 2 });
}
// valeur estimée d'une carte possédée (toutes ses versions × quantités)
function cardValue(cardId){
  const rec = owned[cardId];
  if (!rec || !rec.v) return null;
  let total = 0, unit = null, partial = false;
  for (const name in rec.v){
    const p = priceForVariant(cardId, name);
    if (!p){ partial = true; continue; }
    if (unit && p.unit !== unit){ partial = true; continue; } // devises différentes : on n'additionne pas
    unit = p.unit;
    total += p.value * rec.v[name].length;
  }
  return unit ? { value: total, unit, partial } : null;
}

// --- valeur totale de la collection ---
// Somme des prix de chaque version possédée × sa quantité.
function collectionValue(){
  let eur = 0, usd = 0, missing = 0;
  for (const id in owned){
    const rec = owned[id]; if (!rec || !rec.v) continue;
    for (const name in rec.v){
      const q = rec.v[name].length;
      const p = priceForVariant(id, name);
      if (!p){ missing += q; continue; }
      if (p.unit === "EUR") eur += p.value * q; else usd += p.value * q;
    }
  }
  return { eur, usd, missing };
}
function formatAmount(v, unit){
  return v.toLocaleString("fr-FR", { style: "currency", currency: unit, maximumFractionDigits: 2 });
}
function valueSummary(){
  const { eur, usd, missing } = collectionValue();
  const parts = [];
  if (eur > 0) parts.push(formatAmount(eur, "EUR"));
  if (usd > 0) parts.push(formatAmount(usd, "USD"));
  return { text: parts.length ? parts.join(" + ") : "—", missing };
}

// récupère les métadonnées (versions/rareté/prix) manquantes ou périmées pour une liste de cartes
async function fetchMissingMeta(ids, onProgress){
  const todo = ids.filter(metaStale);
  let done = 0;
  if (onProgress) onProgress(done, todo.length);
  const CHUNK = 6; // quelques cartes à la fois, pour ne pas surcharger l'API
  for (let i = 0; i < todo.length; i += CHUNK){
    await Promise.all(todo.slice(i, i + CHUNK).map(async id => { await fetchMeta(id); done++; }));
    if (onProgress) onProgress(done, todo.length);
  }
  persistMeta();
}

let computing = false;
// récupère les prix manquants ou périmés, puis affiche le total
async function computeValue(){
  if (computing) return;
  const ids = Object.keys(owned);
  if (!ids.length){ renderValueBox("Ta collection est vide."); return; }
  computing = true;
  await fetchMissingMeta(ids, (done, total) => renderValueBox(`Calcul… ${done} / ${total}`, true));
  const { text, missing } = valueSummary();
  try { localStorage.setItem(VALUE_KEY, JSON.stringify({ text, missing, t: Date.now() })); } catch {}
  computing = false;
  renderValueBox();
}

function renderValueBox(msg, busy){
  const box = document.getElementById("valueBox");
  if (!box) return;
  if (msg){
    box.innerHTML = `<div class="value-msg">${busy ? `<span class="mini-spin"></span>` : ""}${msg}</div>`;
    return;
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(VALUE_KEY)); } catch {}
  const live = Object.keys(owned).length ? valueSummary() : null;
  const shown = (live && live.text !== "—") ? live : saved;
  if (!shown){
    box.innerHTML = `<button id="calcValue" class="value-btn">Calculer la valeur</button>`;
  } else {
    box.innerHTML =
      `<div class="value-amount">${shown.text}</div>` +
      (shown.missing ? `<div class="value-note">${shown.missing} carte${shown.missing>1?"s":""} sans prix connu</div>` : ``) +
      `<button id="calcValue" class="value-btn small">Recalculer</button>`;
  }
  const b = document.getElementById("calcValue");
  if (b) b.onclick = computeValue;
}

  });
  body.querySelectorAll(".copy-row .vcond").forEach(sel => sel.onchange = () => {
    const copies = owned[c.id] && owned[c.id].v ? owned[c.id].v[sel.dataset.name] : null;
    const cp = copies && copies[Number(sel.dataset.i)];
    if (cp){ cp.cond = sel.value; save(); }
  });
  body.querySelectorAll(".copy-row .vlang").forEach(sel => sel.onchange = () => {
    const copies = owned[c.id] && owned[c.id].v ? owned[c.id].v[sel.dataset.name] : null;
    const cp = copies && copies[Number(sel.dataset.i)];
    if (cp){ cp.lang = sel.value; save(); }
  });
  body.querySelectorAll(".copy-remove").forEach(btn => btn.onclick = () => {
    const r = owned[c.id];
    const copies = r && r.v ? r.v[btn.dataset.name] : null;
    if (copies){
      copies.splice(Number(btn.dataset.i), 1);
      if (!copies.length) delete r.v[btn.dataset.name]; // plus aucun exemplaire : version retirée
      if (!Object.keys(r.v).length) delete owned[c.id]; // plus aucune version : carte non possédée
    }
    saveNow(); renderModalBody(); render();
  });
  $("mWish").onclick = () => {
    if (wishlist[c.id]) delete wishlist[c.id]; else wishlist[c.id] = true;
    saveNow(); renderModalBody(); render();
  };
}

function closeModal(){ $("overlay").hidden = true; openCard = null; }

function passFilter(c){
  if (filter === "owned") return !!owned[c.id];
  if (filter === "missing") return !owned[c.id];
  if (filter === "wishlist") return !!wishlist[c.id];
  return true;
}

// trie une liste de cartes selon le tri courant (renvoie une copie)
function sortCards(list){
  const arr = list.slice();
  const num = (a, b) => String(a.localId).localeCompare(String(b.localId), undefined, { numeric: true });
  const name = (a, b) => (a.name || "").localeCompare(b.name || "", "fr");
  if (sortBy === "num-asc")  arr.sort(num);
  else if (sortBy === "num-desc")  arr.sort((a, b) => num(b, a));
  else if (sortBy === "name-asc")  arr.sort(name);
  else if (sortBy === "name-desc") arr.sort((a, b) => name(b, a));
  return arr;
}

// N'affiche que les commandes qui agissent réellement sur l'onglet courant.
// Deux familles : « Navigation » (Série + recherche, toujours là, mènent à la vue Série)
// et « Filtres de la vue » (puces + rareté + tri, propres à ce qu'on regarde).
function syncControls(){
  const isSet = view === "set";
  const isColl = view === "collection";
  const isStatsTrade = view === "stats" || view === "trade";

  // Puces : Manquantes/Possédées n'ont de sens que dans une série ; dans « Ma collection »
  // on ne garde que Toutes + Souhaits (Possédées ferait doublon avec Toutes).
  const chipVis = { all: isSet || isColl, owned: isSet, missing: isSet, wishlist: isSet || isColl };
  if (!chipVis[filter]) filter = "all"; // le filtre courant n'existe plus ici → retour à Toutes
  document.querySelectorAll(".chip").forEach(c => {
    c.hidden = !chipVis[c.dataset.f];
    c.classList.toggle("on", c.dataset.f === filter);
  });
  $("filters").hidden = isStatsTrade; // aucune puce pertinente sur Statistiques / Échange

  // Rareté : uniquement la vue Série (le calcul est propre à la série affichée).
  // Trier : Série + Ma collection. Aucun des deux sur Statistiques / Échange (ordre figé).
  $("rarityField").hidden = !isSet;
  $("sortField").hidden = !(isSet || isColl);
  $("filterSection").hidden = isStatsTrade;

  // Le sélecteur de série (et sa progression) n'a de sens que dans la vue Série : sur les
  // vues d'ensemble, il afficherait la progression d'une seule série sans rapport avec l'écran.
  // La recherche, elle, reste (c'est un raccourci de navigation).
  $("serieField").hidden = !isSet;
  // L'indice « la recherche ouvre la vue Série » n'a de sens que si on n'y est pas déjà.
  $("navHint").hidden = isSet;
}

function render(){
  // la barre de progression reste celle de la série sélectionnée
  const have = cards.filter(c => owned[c.id]).length;
  const total = cards.length;
  $("have").textContent = have;
  $("total").textContent = total;
  $("fill").style.width = total ? Math.round(have/total*100) + "%" : "0%";
  updateSub();
  document.querySelectorAll("#viewTabs .tab").forEach(t =>
    t.classList.toggle("on", t.dataset.view === view));
  syncControls();
  if (!computing) renderValueBox();

  if (search) renderSearch();
  else if (view === "stats") renderStats();
  else if (view === "trade") renderTrade();
  else if (view === "collection") renderCollection();
  else renderSet();
}

// affichage normal : une seule série
function renderSet(){
  let list = cards.filter(passFilter);
  if (rarityFilter && rarityIds) list = list.filter(c => rarityIds.has(c.id));
  const shown = sortCards(list);
  if (!shown.length){
    const m = rarityFilter ? "Aucune carte de cette rareté dans cette série (avec ce filtre)."
      : filter==="missing" ? "Bravo, tu as toutes les cartes de cette série !"
      : filter==="owned" ? "Aucune carte de cette série pour l'instant. Touche une carte pour l'ajouter."
      : filter==="wishlist" ? "Aucune carte de cette série dans ta liste de souhaits."
      : "Aucune carte à afficher.";
    content.innerHTML = emptyMsg(filter === "wishlist" ? ICONS.heart : ICONS.cards, m);
    return;
  }
  const grid = document.createElement("div");
  grid.className = "grid";
  shown.forEach(c => grid.appendChild(cardButton(c)));
  content.innerHTML = "";
  content.appendChild(grid);
}

// affichage groupé par série (réutilisé par la recherche et la vue collection)
function renderGrouped(list, hintText){
  const groups = {};
  for (const c of list){
    const sid = c.id.slice(0, c.id.lastIndexOf("-")) || c.id;
    (groups[sid] = groups[sid] || []).push(c);
  }
  const orderedIds = setList.map(s => s.id).filter(id => groups[id]);
  Object.keys(groups).forEach(id => { if (!orderedIds.includes(id)) orderedIds.push(id); });

  content.innerHTML = "";
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = hintText(list.length, orderedIds.length);
  content.appendChild(hint);

  const CAP = 500;
  let rendered = 0, capped = false;
  for (const sid of orderedIds){
    if (rendered >= CAP){ capped = true; break; }
    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<span>${setNameById[sid] || sid}</span><small>${groups[sid].length}</small>`;
    content.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const c of sortCards(groups[sid])){
      if (rendered >= CAP){ capped = true; break; }
      grid.appendChild(cardButton(c));
      rendered++;
    }
    content.appendChild(grid);
  }
  if (capped){
    const note = document.createElement("p");
    note.className = "hint";
    note.textContent = "Affichage limité à 500 cartes. Utilise la recherche pour cibler.";
    content.appendChild(note);
  }
}

// affichage recherche : toutes les séries, regroupées par section
async function renderSearch(){
  if (!allCards){
    content.innerHTML = `<div class="msg"><div class="spin"></div>Préparation de la recherche… (une seule fois)</div>`;
    await loadAllCards();

  const results = allCards.filter(c => passFilter(c) && matchesSearch(c));

  }
  renderGrouped(results, (n, m) =>
    n + " résultat" + (n>1?"s":"") + " dans " + m + " série" + (m>1?"s":""));

// affichage global : ma collection (possédées) ou ma liste de souhaits, regroupée par série
async function renderCollection(){
  const wish = filter === "wishlist";
  const source = wish ? wishlist : owned;
  if (!Object.keys(source).length){
    content.innerHTML = wish
      ? emptyMsg(ICONS.heart, "Ta liste de souhaits est vide.<br>Ouvre une carte et ajoute-la avec ♡.")

// --- liste d'échange : versions possédées en double (≥ 2 exemplaires) ---
// Une Normale et une Holo de la même carte sont deux entrées distinctes : on
// compte les doubles PAR VERSION, pas sur le total toutes versions confondues.
function tradeEntries(){
  const out = [];
  for (const id in owned){
    const rec = owned[id]; if (!rec || !rec.v) continue;
    for (const name in rec.v){
      const n = rec.v[name].length;
      if (n >= 2) out.push({ id, version: name, count: n, extra: n - 1 });
    }
  }
  return out;
}

async function renderTrade(){
  const entries = tradeEntries();
  if (!entries.length){
    content.innerHTML = emptyMsg(ICONS.swap, "Aucun double pour l'instant.<br>Une version avec au moins 2 exemplaires apparaîtra ici.");
    return;
  }
  if (!allCards){
    content.innerHTML = `<div class="msg"><div class="spin"></div>Préparation… (une seule fois)</div>`;
    await loadAllCards();
    if (allCards && view === "trade") renderTrade();
    return;
  }
  const byId = {};
  for (const c of allCards) byId[c.id] = c;

  const groups = {};
  entries.forEach(e => {
    const sid = e.id.slice(0, e.id.lastIndexOf("-")) || e.id;
    (groups[sid] = groups[sid] || []).push(e);
  });
  const orderedIds = setList.map(s => s.id).filter(id => groups[id]);
  Object.keys(groups).forEach(id => { if (!orderedIds.includes(id)) orderedIds.push(id); });

  content.innerHTML = "";
  const totalExtra = entries.reduce((s, e) => s + e.extra, 0);
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = `${entries.length} version${entries.length>1?"s":""} en double dans ${orderedIds.length} série${orderedIds.length>1?"s":""} · `
    + `${totalExtra} exemplaire${totalExtra>1?"s":""} en trop à échanger`;
  content.appendChild(hint);

  for (const sid of orderedIds){
    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<span>${setNameById[sid] || sid}</span><small>${groups[sid].length}</small>`;
    content.appendChild(head);

    const list = document.createElement("div");
    list.className = "trade-list";
    groups[sid].forEach(e => {
      const card = byId[e.id];
      if (!card) return;
      const row = document.createElement("button");
      row.type = "button";
      row.className = "trade-row";
      row.innerHTML =
        (card.image ? `<img src="${card.image}/low.webp" alt="">` : `<div class="noimg" style="width:38px;height:53px;border-radius:6px;"></div>`)
        + `<div class="trade-info">
             <div class="trade-name">${card.name}</div>
             <div class="trade-version">${e.version} · n° ${card.localId}</div>
           </div>
           <span class="trade-badge">${e.extra} en trop</span>`;
      row.onclick = () => openModal(card);
      list.appendChild(row);
    });
    content.appendChild(list);
  }
}

let loadingStats = false;
async function renderStats(){
  const ids = Object.keys(owned);
  if (!ids.length){
    content.innerHTML = emptyMsg(ICONS.chart, "Ta collection est vide pour l'instant.<br>Les statistiques apparaîtront une fois que tu auras ajouté des cartes.");

  }
  if (!blocksReady){

    return; // loadBlocks() relance l'affichage une fois prêt
  }
  if (loadingStats) return;
  const todo = ids.filter(metaStale);
  if (todo.length){
    loadingStats = true;
    content.innerHTML = `<div class="msg"><div class="spin"></div>Calcul des statistiques…</div>`;
    await fetchMissingMeta(ids, (done, total) => {
      content.innerHTML = `<div class="msg"><div class="spin"></div>Calcul des statistiques… ${done} / ${total}</div>`;
    });
    loadingStats = false;
  }
  renderStatsContent(ids);
}

// nombre de cartes possédées par bloc, comparé au total officiel du bloc
function blockProgress(ids){
  const haveBySet = {};
  for (const id of ids){
    const sid = id.slice(0, id.lastIndexOf("-")) || id;
    haveBySet[sid] = (haveBySet[sid] || 0) + 1;
  }
  return blocks
    .map(b => {
      const sets = b.sets
        .map(s => ({
          id: s.id,
          name: s.name,
          have: haveBySet[s.id] || 0,
          total: parseInt(setOfficialById[s.id], 10) || 0,
        }))
        .filter(s => s.total > 0);
      const have = sets.reduce((sum, s) => sum + s.have, 0);
      const total = sets.reduce((sum, s) => sum + s.total, 0);
      return { name: b.name, have, total, sets };
    })
    .filter(b => b.total > 0);
}

// nombre de cartes possédées par rareté
function rarityBreakdown(ids){
  const counts = {};
  for (const id of ids){
    const r = rarityByCard[id] || "Rareté inconnue";
    counts[r] = (counts[r] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderStatsContent(ids){
  content.innerHTML = "";

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = ids.length + " carte" + (ids.length > 1 ? "s" : "") + " différente" + (ids.length > 1 ? "s" : "") + " dans ta collection";
  content.appendChild(hint);

  const blockHead = document.createElement("div");
  blockHead.className = "section-head";
  blockHead.innerHTML = `<span>Progression par bloc</span>`;
  content.appendChild(blockHead);

  const blockStats = blockProgress(ids);
  const blockList = document.createElement("div");
  blockList.className = "stat-list";
  if (!blockStats.length){
    blockList.innerHTML = `<p class="hint">Pas encore de série reconnue par bloc.</p>`;
  } else {
    blockStats.forEach(b => {
      const pct = b.total ? Math.round(b.have / b.total * 100) : 0;
      const details = document.createElement("details");
      details.className = "stat-block";
      const summary = document.createElement("summary");
      summary.className = "stat-block-summary";
      summary.innerHTML =
        `<span class="stat-caret">${svgIco(ICONS.chevron, "ico ico-sm")}</span>
         <div class="stat-label">${b.name}</div>
         <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
         <div class="stat-value">${b.have} / ${b.total}</div>`;
      details.appendChild(summary);

      const sublist = document.createElement("div");
      sublist.className = "stat-sublist";
      b.sets.forEach(s => {
        const spct = s.total ? Math.round(s.have / s.total * 100) : 0;
        const subrow = document.createElement("button");
        subrow.type = "button";
        subrow.className = "stat-subrow";
        subrow.innerHTML =
          `<div class="stat-label">${s.name}</div>
           <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${spct}%"></div></div>
           <div class="stat-value">${s.have} / ${s.total}</div>`;
        subrow.onclick = () => selectSet(s.id);
        sublist.appendChild(subrow);
      });
      details.appendChild(sublist);
      blockList.appendChild(details);
    });
  }
  content.appendChild(blockList);

  const rarityHead = document.createElement("div");
  rarityHead.className = "section-head";
  rarityHead.innerHTML = `<span>Répartition par rareté</span>`;
  content.appendChild(rarityHead);

  const rarityStats = rarityBreakdown(ids);
  const rarityList = document.createElement("div");
  rarityList.className = "stat-list";
  const maxCount = Math.max(...rarityStats.map(([, n]) => n), 1);
  rarityStats.forEach(([name, count]) => {
    const pct = Math.round(count / maxCount * 100);
    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML =
      `<div class="stat-label">${name}</div>
       <div class="stat-bar-track"><div class="stat-bar-fill rarity" style="width:${pct}%"></div></div>
       <div class="stat-value">${count}</div>`;
    rarityList.appendChild(row);
  });
  content.appendChild(rarityList);
}

function renderSetMenu(q){
  const nq = normalize(q);
  const item = s => `<div class="combo-item${s.id===currentSetId?" on":""}" data-id="${s.id}">${s.name}</div>`;
  if (!blocksReady){
    // liste à plat tant que les blocs ne sont pas chargés
    const items = setList.filter(s => !nq || normalize(s.name).includes(nq));
    setMenu.innerHTML = items.length ? items.map(item).join("") : `<div class="combo-empty">Aucune série trouvée</div>`;
    return;
  }
  let html = "";
  for (const block of blocks){
    const matches = block.sets.filter(s => !nq || normalize(s.name).includes(nq));

    html += `<div class="combo-block">${block.name}</div>` + matches.map(item).join("");

    });
    body.querySelectorAll(".grant-remove").forEach(b => b.onclick = () => revokeAccess(b.dataset.k, b.dataset.uid));
    document.getElementById("btnLogout").onclick = () => signOut(auth);
    return;
  }
  body.innerHTML =
    `<button class="big-btn btn-add" id="btnGoogle" style="margin-bottom:18px;">Se connecter avec Google</button>
     <div class="field"><label>Email</label>
       <input id="authEmail" type="email" autocomplete="email" style="${inputStyle}"></div>
     <div class="field"><label>Mot de passe</label>
       <input id="authPass" type="password" autocomplete="current-password" style="${inputStyle}"></div>
     <div class="field-row">
       <button class="big-btn btn-add" id="btnLogin">Se connecter</button>
       <button class="big-btn" id="btnSignup" style="background:var(--surface-2);color:var(--ink);">Créer un compte</button>
     </div>`;
  document.getElementById("btnGoogle").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Connexion à Google…");
    try { await signInWithPopup(auth, googleProvider); }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
  const email = () => document.getElementById("authEmail").value.trim();
  const pass  = () => document.getElementById("authPass").value;
  document.getElementById("btnLogin").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Connexion…");
    try { await signInWithEmailAndPassword(auth, email(), pass()); }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
  document.getElementById("btnSignup").onclick = async () => {
    interactiveLogin = true;
    setAuthStatus("Création du compte…");
    try { await createUserWithEmailAndPassword(auth, email(), pass()); }
    catch (e){ interactiveLogin = false; setAuthStatus(authError(e), false); }
  };
}

function authError(e){
  const c = (e && e.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password")) return "Email ou mot de passe incorrect.";
  if (c.includes("email-already-in-use")) return "Un compte existe déjà avec cet email. Connecte-toi.";
  if (c.includes("weak-password")) return "Mot de passe trop court (6 caractères minimum).";
  if (c.includes("invalid-email")) return "Email invalide.";
  if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "Connexion Google annulée.";
  if (c.includes("unauthorized-domain")) return "Connexion Google indisponible ici : à tester une fois la page hébergée (étape 4).";
  return "Erreur de connexion. Réessaie.";
}

$("syncBtn").addEventListener("click", () => {
  renderAccountBody();
  setAuthStatus(currentUser ? "Synchro active." : "");
  $("syncOverlay").hidden = false;
});
$("syncClose").addEventListener("click", () => { $("syncOverlay").hidden = true; });
$("syncOverlay").addEventListener("click", (e) => { if (e.target === $("syncOverlay")) $("syncOverlay").hidden = true; });

// --- thème clair / sombre ---
const THEME_KEY = "collection_pokemon_theme";
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#14161d" : "#f0eee9");
  // un seul bouton, dont l'icône reflète l'action : lune = passer au sombre, soleil = revenir au clair
  const btn = $("themeBtn");
  if (btn){
    btn.innerHTML = svgIco(theme === "dark" ? ICONS.sun : ICONS.moon);
    const label = theme === "dark" ? "Passer au thème clair" : "Passer au thème sombre";
    btn.title = label;
    btn.setAttribute("aria-label", label);
    btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  }
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
$("themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

// --- bouton retour en haut ---
const topBtn = $("topBtn");
window.addEventListener("scroll", () => {
  topBtn.classList.toggle("show", window.scrollY > 400);
}, { passive: true });
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

// réagit à la connexion / déconnexion
onAuthStateChanged(auth, (user) => { if (user) onLogin(user); else onLogout(); });

init();
</script>
<script>
// --- Enregistrement du service worker (mode appli + hors-ligne) ---
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      if (reg.waiting) showUpdateBar(); // une nouvelle version attendait déjà
      // Une nouvelle version est disponible : on prévient et on recharge après accord.
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            showUpdateBar();
          }
        });
      });
    }).catch(() => { /* pas de service worker : l'appli fonctionne normalement */ });

    // Rechargement une fois la nouvelle version active
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  });
}

function showUpdateBar() {
  if (document.getElementById("updateBar")) return;
  const bar = document.createElement("div");
  bar.id = "updateBar";
  bar.innerHTML = `<span>Nouvelle version disponible</span><button id="updateBtn">Mettre à jour</button>`;
  Object.assign(bar.style, {
    position: "fixed", left: "16px", right: "16px", bottom: "16px", zIndex: 100,
    background: "#1c2333", color: "#fff", borderRadius: "14px", padding: "13px 16px",
    display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px",
    fontFamily: "system-ui, sans-serif", fontWeight: "700", fontSize: "14px",
    boxShadow: "0 10px 30px rgba(0,0,0,.3)", maxWidth: "520px", margin: "0 auto",
  });
  document.body.appendChild(bar);
  const btn = document.getElementById("updateBtn");
  Object.assign(btn.style, {
    background: "#ffcb3d", color: "#1a1d29", border: "none", borderRadius: "9px",
    padding: "8px 14px", fontFamily: "inherit", fontWeight: "800", fontSize: "13px",
    cursor: "pointer", flex: "none",
  });
  btn.onclick = () => {
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (reg && reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      else location.reload();
    });
    bar.remove();
  };
}
// --- Bouton d'installation (Android/Chrome natif, instructions sur iPhone) ---
(function () {
  const btn = document.getElementById("installBtn");
  if (!btn) return;

  // Déjà installée ? On ne propose rien.
  const installed = window.matchMedia("(display-mode: standalone)").matches
    || navigator.standalone === true;
  if (installed) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  let deferred = null;

  // Android / Chrome : le navigateur nous signale que l'installation est possible
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();     // on garde la main pour déclencher via notre bouton
    deferred = e;
    btn.hidden = false;
  });

  window.addEventListener("appinstalled", () => {
    btn.hidden = true;
    deferred = null;
  });

  // iPhone : aucun signal n'existe, on affiche le bouton pour expliquer la marche à suivre
  if (isIOS) btn.hidden = false;

  btn.onclick = async () => {
    if (deferred) {
      deferred.prompt();
      const choice = await deferred.userChoice;
      deferred = null;
      if (choice && choice.outcome === "accepted") btn.hidden = true;
      return;
    }
    showIosHelp();
  };

  function showIosHelp() {
    if (document.getElementById("iosHelp")) return;
    const ov = document.createElement("div");
    ov.id = "iosHelp";
    ov.className = "overlay";
    ov.innerHTML =
      `<div class="modal" role="dialog" aria-modal="true">
         <button class="modal-close" aria-label="Fermer">&times;</button>
         <h2 class="modal-name">Installer l'application</h2>
         <p class="modal-meta">Sur iPhone et iPad, l'installation passe par le menu de partage de Safari.</p>
         <ol class="ios-steps">
           <li>Touche le bouton <strong>Partager</strong> en bas de Safari (le carré avec une flèche vers le haut).</li>
           <li>Fais défiler, puis choisis <strong>« Sur l'écran d'accueil »</strong>.</li>
           <li>Confirme avec <strong>Ajouter</strong>.</li>
         </ol>
         <p class="pricenote">L'icône apparaîtra ensuite sur ton écran d'accueil.</p>
       </div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector(".modal-close").onclick = close;
    ov.onclick = (e) => { if (e.target === ov) close(); };
  }
})();
</script>
