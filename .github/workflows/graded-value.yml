name: Estimation gradée (PSA) de la collection
# « Et si elle était gradée ? » : une fois par jour, lit la collection dans Firestore,
# interroge PSA (compte connecté) pour la population et les ventes par note, et écrit le
# rapport dans Firestore `graded_reports/{uid}` (privé, lu par public/graded-value.html).
#
# Secrets nécessaires : FIREBASE_SERVICE_ACCOUNT (déjà utilisé pour le déploiement ; le compte
# de service doit avoir le rôle Cloud Datastore User), PSA_EMAIL, PSA_PASSWORD.
# Le seul fichier du dépôt modifié est tools/psa-sets-map.json (correspondances de séries).

on:
  schedule:
    - cron: "41 5 * * *"      # tous les jours à 05:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: graded-value
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install --quiet requests firebase-admin playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Calculer l'estimation et écrire le rapport
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PSA_EMAIL: ${{ secrets.PSA_EMAIL }}
          PSA_PASSWORD: ${{ secrets.PSA_PASSWORD }}
          PSA_COOKIE_FILE: ${{ runner.temp }}/psa-cookies.json
          PSA_DEBUG_DIR: ${{ runner.temp }}/psa-debug
        run: python tools/psa_collection_value.py --threshold 10 --months 6 --discount 0.15

      - name: Captures d'écran de diagnostic (si la connexion PSA a échoué)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psa-debug
          path: ${{ runner.temp }}/psa-debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Committer les caches PSA (séries, population) s'ils ont changé
        if: always()
        run: |
          git add tools/psa-sets-map.json tools/psa-pop
          [ -f tools/psa-sets-index.json ] && git add tools/psa-sets-index.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "graded-value-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MàJ auto des caches PSA — séries et population ($(date -u +%FT%TZ))"
          git pull --rebase -q origin main && git push
