name: Scraper Vinted PSA
# Étape 1 du système « bonnes affaires » : récupère périodiquement les annonces
# Vinted de cartes Pokémon gradées PSA et committe public/vinted-psa.json quand il change.
#
# ⚠️ Le commit fait ici avec GITHUB_TOKEN NE déclenche PAS le workflow de déploiement
# (deploy.yml) : GitHub bloque l'enchaînement de workflows via le jeton automatique.
# On déploie donc Firebase Hosting directement dans ce workflow, avec le même compte
# de service que deploy.yml, et seulement si le fichier a changé.

on:
  schedule:
    # toutes les 6 h (minute 17 pour éviter la congestion en début d'heure).
    # Fréquence volontairement basse : les IP GitHub Actions sont des plages
    # datacenter connues, on ne veut pas attirer l'anti-bot de Vinted.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-vinted-psa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les annonces PSA
        run: python tools/scrape_vinted_psa.py --pages 6

      - name: Committer si le fichier a changé
        id: commit
        run: |
          if git diff --quiet -- public/vinted-psa.json; then
            echo "Aucun changement — rien à committer."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "vinted-psa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vinted-psa.json
          git commit -m "MàJ auto des annonces Vinted PSA ($(date -u +%FT%TZ))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Déployer sur Firebase Hosting (si changé)
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ma-collection-pokemon
          channelId: live
