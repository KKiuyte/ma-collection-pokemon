name: Scraper + enrichissement Vinted PSA
# Système « bonnes affaires » :
#   1. scrape_vinted_psa.py  → public/vinted-psa.json   (annonces Vinted brutes)
#   2. enrich_psa.py         → ajoute à chaque annonce le cert PSA lu sur les photos
#                              (OCR), la fiche PSA (API publique, jeton PSA_API_TOKEN)
#                              et l'estimation (ventes PSA, compte PSA_EMAIL/PSA_PASSWORD),
#                              met à jour public/psa-cache.json, calcule les bonnes affaires
#   3. commit des JSON qui ont changé, puis déploiement Firebase Hosting
#
# ⚠️ Le commit via GITHUB_TOKEN ne déclenche PAS deploy.yml (GitHub bloque
# l'enchaînement de workflows par le jeton automatique) → on déploie ici même.
#
# Rythme : Vinted reçoit ~1 000 annonces PSA/jour et la page n'affiche que les ~230 plus
# récentes ; à ~10 s d'OCR par annonce, il faut ~100 annonces toutes les 3 h pour suivre.
# Fiches PSA via le compte connecté (tRPC, pas de quota) : 100 par passage (~6 s chacune).

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-vinted-psa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les annonces PSA
        run: python tools/scrape_vinted_psa.py --pages 6

      - name: Installer les dépendances d'enrichissement
        run: |
          pip install --quiet requests pillow numpy \
            rapidocr-onnxruntime onnxruntime playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Enrichir avec PSA (OCR du cert + fiche + estimation)
        continue-on-error: true    # un échec PSA laisse quand même déployer le scrape
        env:
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          PSA_EMAIL: ${{ secrets.PSA_EMAIL }}
          PSA_PASSWORD: ${{ secrets.PSA_PASSWORD }}
          PSA_COOKIE_FILE: ${{ runner.temp }}/psa-cookies.json
          PSA_DEBUG_DIR: ${{ runner.temp }}/psa-debug
        run: python tools/enrich_psa.py --max-ocr 100 --max-lookups 100 --verbose

      - name: Captures d'écran de diagnostic (si la connexion PSA a échoué)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psa-debug
          path: ${{ runner.temp }}/psa-debug
          if-no-files-found: ignore
          retention-days: 3

      - name: Committer si un fichier a changé
        id: commit
        run: |
          if git diff --quiet -- public/vinted-psa.json public/psa-cache.json; then
            echo "Aucun changement — rien à committer."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "vinted-psa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vinted-psa.json public/psa-cache.json
          git commit -m "MàJ auto annonces + fiches PSA ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Déployer sur Firebase Hosting (si changé)
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ma-collection-pokemon
          channelId: live
